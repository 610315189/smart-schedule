<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b5cff">
  <meta name="description" content="智能课表 · 课前提醒 + 空教室查询">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="智能课表">
  <meta name="format-detection" content="telephone=no">
  <title>智能课表</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>
  <div id="app">
    <main id="view" class="view" role="main"></main>

    <nav id="tabbar" class="tabbar" role="tablist" aria-label="主导航">
      <button class="tab" data-tab="today" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2" stroke-linecap="round"/>
        </svg>
        <span>今日</span>
      </button>
      <button class="tab" data-tab="timetable" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/>
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/>
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/>
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>
        </svg>
        <span>课表</span>
      </button>
      <button class="tab" data-tab="classroom" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
          <path d="M3.5 10h17" stroke-linecap="round"/>
          <rect x="6.5" y="13" width="4" height="3.5" rx="0.8"/>
          <rect x="13.5" y="13" width="4" height="3.5" rx="0.8"/>
        </svg>
        <span>空教室</span>
      </button>
      <button class="tab" data-tab="settings" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/>
          <circle cx="16" cy="7" r="2.4" fill="var(--card)"/>
          <circle cx="8" cy="12" r="2.4" fill="var(--card)"/>
          <circle cx="14" cy="17" r="2.4" fill="var(--card)"/>
        </svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <noscript>
    <p style="padding:24px;text-align:center">这个页面需要启用 JavaScript 才能使用。</p>
  </noscript>

  <script src="js/wx-shim.js?v=3"></script>
  <script src="js/bundle.js?v=3"></script>
  <script src="js/ics.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
