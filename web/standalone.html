<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b5cff">
  <meta name="description" content="智能课表 · 课前提醒 + 空教室查询">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="智能课表">
  <meta name="format-detection" content="telephone=no">
  <title>智能课表（单文件版）</title>
  <style>
/* ============================================================
   智能课表 · 网页版样式
   移动端优先；桌面端居中为手机宽度；支持深色模式
   ============================================================ */

:root {
  --primary: #2b5cff;
  --primary-dark: #1f47db;
  --primary-soft: #eef2ff;
  --green: #0ca678;
  --green-soft: #e6f9f1;
  --orange: #f76707;
  --orange-soft: #fff2e6;
  --red: #e03131;
  --red-soft: #ffecef;

  --bg: #f2f4f8;
  --card: #ffffff;
  --text: #1c2333;
  --text-2: #46506b;
  --muted: #8a93a6;
  --border: #eef0f5;
  --line: #f4f6fa;

  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(20, 40, 90, 0.06);
  --shadow-lg: 0 12px 36px rgba(16, 24, 48, 0.18);

  --tabbar-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1420;
    --card: #1a2130;
    --text: #e8ecf5;
    --text-2: #b3bccd;
    --muted: #8b94a8;
    --border: #252d3d;
    --line: #222a38;
    --primary-soft: #1c2744;
    --green-soft: #12251f;
    --orange-soft: #2a1f12;
    --red-soft: #2a1519;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/*
 * 关键：hidden 属性必须真的能隐藏元素。
 * 浏览器默认样式是 [hidden]{display:none}，但类选择器（如 .overlay{display:flex}）
 * 优先级更高会把它覆盖掉——结果是弹层遮罩一直铺满全屏，拦截所有点击。
 */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
    "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}
button { cursor: pointer; border: none; background: none; padding: 0; }

/* ---------- 应用骨架 ---------- */
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 8px);
  position: relative;
}

.view {
  padding: calc(10px + var(--safe-t)) 14px 18px;
  animation: fade-in 0.18s ease-out;
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-width: 480px;
  margin: 0 auto;
  height: calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: flex;
  background: var(--card);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--muted);
  font-size: 11px;
  transition: color 0.15s;
}
.tab svg { width: 23px; height: 23px; }
.tab[aria-selected="true"] { color: var(--primary); font-weight: 600; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
}
.card-title .sub { font-size: 12px; font-weight: 400; color: var(--muted); }

/* ---------- 通用 ---------- */
.row { display: flex; align-items: center; }
.between { display: flex; align-items: center; justify-content: space-between; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.gap8 { gap: 8px; }
.gap12 { gap: 12px; }
.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.strong { font-weight: 600; }
.ellipsis { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

/* ---------- 按钮 ---------- */
.btn {
  display: block;
  width: 100%;
  padding: 13px 16px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.985); opacity: 0.88; }
.btn-primary { background: linear-gradient(135deg, #3b6bff, #2b5cff); color: #fff; box-shadow: 0 4px 14px rgba(43, 92, 255, 0.28); }
.btn-ghost { background: var(--primary-soft); color: var(--primary); }
.btn-plain { background: var(--line); color: var(--text-2); }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-sm { padding: 9px 14px; font-size: 13px; border-radius: 999px; width: auto; }

/* ---------- 标签 ---------- */
.tag {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--primary-soft);
  color: var(--primary);
  vertical-align: middle;
}
.tag-gray { background: var(--line); color: var(--muted); }
.tag-green { background: var(--green-soft); color: var(--green); }
.tag-orange { background: var(--orange-soft); color: var(--orange); }
.tag-red { background: var(--red-soft); color: var(--red); }

/* ---------- 顶部主卡（倒计时） ---------- */
.hero {
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 12px;
  color: #fff;
  background: linear-gradient(135deg, #3b6bff 0%, #2b5cff 55%, #1f47db 100%);
  box-shadow: 0 8px 26px rgba(43, 92, 255, 0.28);
}
.hero.during { background: linear-gradient(135deg, #12b886, #0ca678 60%, #099268); box-shadow: 0 8px 26px rgba(12, 166, 120, 0.28); }
.hero.idle { background: linear-gradient(135deg, #6b7385, #4d566b); box-shadow: 0 8px 26px rgba(77, 86, 107, 0.22); }

.hero-top { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.88; }
.hero-label { font-size: 13px; opacity: 0.92; margin-top: 14px; }
.hero-count { font-size: 44px; font-weight: 700; letter-spacing: 1px; line-height: 1.1; font-variant-numeric: tabular-nums; margin: 2px 0 10px; }
.hero-course { background: rgba(255, 255, 255, 0.16); border-radius: 12px; padding: 11px 13px; }
.hero-name { font-size: 17px; font-weight: 600; }
.hero-meta { font-size: 12px; opacity: 0.92; margin-top: 3px; }
.hero-room { font-size: 13px; margin-top: 5px; }
.hero-actions { display: flex; gap: 8px; margin-top: 14px; }
.hero-btn {
  flex: 1;
  text-align: center;
  padding: 9px 0;
  border-radius: 999px;
  font-size: 12.5px;
  background: rgba(255, 255, 255, 0.22);
  border: 1px solid rgba(255, 255, 255, 0.32);
  color: #fff;
}
.hero-btn:active { background: rgba(255, 255, 255, 0.34); }

/* ---------- 列表条目 ---------- */
.line {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.line:last-child { border-bottom: none; }
.line-dot { width: 4px; height: 34px; border-radius: 4px; flex: none; }

/* 今日时间轴 */
.tl-time { width: 52px; flex: none; font-size: 13px; font-weight: 600; }
.tl-time .end { font-size: 10.5px; color: var(--muted); font-weight: 400; }
.tl-status { flex: none; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--line); color: var(--muted); }
.tl-status.ongoing { background: var(--green-soft); color: var(--green); }
.tl-status.soon { background: var(--orange-soft); color: var(--orange); }
.tl-status.upcoming { background: var(--primary-soft); color: var(--primary); }
.line.done { opacity: 0.5; }

/* ---------- 课表网格 ---------- */
.timetable-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.week-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.week-nav { color: var(--primary); font-size: 13px; padding: 6px 8px; }
.week-title { font-size: 14px; font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 6px 13px;
  border-radius: 999px;
  background: var(--line);
  color: var(--text-2);
  font-size: 12.5px;
  white-space: nowrap;
}
.chip.active { background: var(--primary); color: #fff; }

.tt-grid {
  display: grid;
  grid-template-columns: 40px repeat(7, minmax(0, 1fr));
  grid-auto-rows: 54px;
  gap: 1px;
  background: var(--line);
  border-radius: 10px;
  overflow: hidden;
  min-width: 100%;
}
.tt-head {
  background: var(--card);
  font-size: 10.5px;
  text-align: center;
  padding: 5px 1px;
  color: var(--text-2);
  position: sticky;
  top: 0;
  z-index: 3;
}
.tt-head b { display: block; font-size: 10.5px; font-weight: 600; }
.tt-head span { color: var(--muted); font-size: 9.5px; }
.tt-head.today b, .tt-head.today span { color: var(--primary); }

.tt-period {
  background: var(--card);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.25;
}
.tt-period b { font-size: 12px; color: var(--text-2); }

.tt-cell { background: var(--card); border: none; padding: 0; position: relative; }
.tt-cell:active { background: var(--primary-soft); }

.tt-block {
  border-radius: 7px;
  padding: 4px 5px;
  color: #fff;
  font-size: 10px;
  line-height: 1.25;
  overflow: hidden;
  z-index: 2;
  border: none;
  text-align: left;
  display: block;
  width: 100%;
  height: 100%;
}
.tt-block:active { opacity: 0.82; }
.tt-block .nm { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tt-block .rm { opacity: 0.9; font-size: 9px; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---------- 空教室 ---------- */
.stat-bar {
  border-radius: var(--radius);
  padding: 15px 16px;
  margin-bottom: 12px;
  color: #fff;
  background: linear-gradient(135deg, #3b6bff, #2b5cff);
  box-shadow: 0 6px 20px rgba(43, 92, 255, 0.24);
}
.stat-line { font-size: 12px; opacity: 0.9; }
.stat-main { display: flex; align-items: baseline; margin-top: 4px; gap: 4px; }
.stat-num { font-size: 32px; font-weight: 700; line-height: 1.1; }
.stat-sub { font-size: 12px; opacity: 0.9; margin-left: 6px; }

.room-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  width: 100%;
  text-align: left;
}
.room-card:active { background: var(--primary-soft); }
.room-name { font-size: 17px; font-weight: 700; }

.warn {
  background: var(--orange-soft);
  color: #b8480a;
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  font-size: 12.5px;
  line-height: 1.55;
  margin-bottom: 10px;
}
@media (prefers-color-scheme: dark) {
  .warn { color: #ffb27a; }
}

/* ---------- 表单 ---------- */
.field { padding: 11px 0; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: none; }
.field-label { font-size: 14px; }
.field-hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.field-value { font-size: 13.5px; color: var(--primary); font-weight: 500; }

.input, .textarea, .select {
  width: 100%;
  background: var(--line);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 11px 12px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--primary); }
.textarea { min-height: 110px; resize: vertical; line-height: 1.5; }

input[type="range"] {
  width: 100%;
  margin: 8px 0 2px;
  accent-color: var(--primary);
}
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }

/* ---------- 底部弹层 ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(12, 18, 32, 0.5);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fade 0.16s ease-out;
}
.overlay.center { align-items: center; padding: 24px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 18px calc(24px + var(--safe-b));
  max-height: 86vh;
  overflow-y: auto;
  animation: slide-up 0.2s ease-out;
}
@keyframes slide-up { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }

.sheet-title { font-size: 17px; font-weight: 700; }
.sheet-sub { font-size: 12.5px; color: var(--muted); margin: 4px 0 14px; }
.sheet .btn { margin-top: 8px; }

.modal {
  width: 100%;
  max-width: 320px;
  background: var(--card);
  border-radius: 18px;
  padding: 22px 20px 16px;
  text-align: center;
  animation: pop 0.18s ease-out;
  box-shadow: var(--shadow-lg);
}
@keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.modal-body { font-size: 13.5px; color: var(--text-2); line-height: 1.65; text-align: left; white-space: pre-line; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 24px);
  transform: translateX(-50%);
  background: rgba(20, 28, 46, 0.92);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 13px;
  z-index: 200;
  max-width: 80vw;
  text-align: center;
  animation: toast-in 0.2s ease-out;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- 提醒横幅 ---------- */
.alert-banner {
  background: linear-gradient(135deg, #ff6b6b, #e03131);
  color: #fff;
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 6px 20px rgba(224, 49, 49, 0.28);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.008); }
}
.alert-banner .t { font-size: 16px; font-weight: 700; }

/* ---------- 空状态 ---------- */
.empty { text-align: center; padding: 36px 12px; color: var(--muted); font-size: 13px; }

/* ---------- 导入区 ---------- */
.dropzone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 26px 16px;
  text-align: center;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone.over { border-color: var(--primary); background: var(--primary-soft); }
.dropzone .big { font-size: 30px; margin-bottom: 6px; }

.preview-item { padding: 9px 0; border-bottom: 1px solid var(--line); }
.preview-item:last-child { border-bottom: none; }

.progress {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
  margin-top: 10px;
}
.progress i {
  display: block;
  height: 100%;
  background: var(--primary);
  width: 0;
  transition: width 0.2s;
}

/* ---------- 桌面端微调 ---------- */
@media (min-width: 700px) {
  body { background: #e7ebf3; }
  @media (prefers-color-scheme: dark) { body { background: #0a0e16; } }
  #app {
    background: var(--bg);
    box-shadow: 0 0 60px rgba(20, 30, 60, 0.12);
    min-height: 100vh;
  }
  .tabbar { border-radius: 0 0 0 0; }
}

/* 打印 */
@media print {
  .tabbar, .hero-actions { display: none; }
  #app { max-width: none; }
}

/* ==== js/wx-shim.js ==== */
/**
 * 浏览器版 wx API 兼容层
 * ---------------------------------------------------------------
 * miniprogram/utils 里的代码是按小程序 API 写的，这里用浏览器
 * 原生能力实现同一套接口，从而让那几个模块「零改动」跑在浏览器里。
 *
 * 对应关系：
 *   wx.getStorageSync   -> localStorage（带内存兜底，隐私模式也能用）
 *   wx.vibrateLong      -> navigator.vibrate
 *   wx.createInnerAudioContext -> Web Audio 合成提示音（不依赖音频文件）
 *   wx.request          -> fetch
 *   wx.addPhoneCalendar -> 下载 .ics 日历文件（交给手机系统日历提醒）
 */
(function (global) {
  'use strict';

  /* ==================== 存储 ==================== */
  var PREFIX = 'ss:';
  var memStore = {};
  var lsOk = false;

  try {
    var probeKey = '__ss_probe__';
    global.localStorage.setItem(probeKey, '1');
    global.localStorage.removeItem(probeKey);
    lsOk = true;
  } catch (e) {
    lsOk = false;
  }

  var store = {
    get: function (key) {
      if (lsOk) {
        try {
          var raw = global.localStorage.getItem(PREFIX + key);
          return raw === null ? '' : raw;
        } catch (e) { /* 落到内存 */ }
      }
      return memStore[key] === undefined ? '' : memStore[key];
    },
    set: function (key, value) {
      var raw = JSON.stringify(value);
      if (lsOk) {
        try {
          global.localStorage.setItem(PREFIX + key, raw);
          return true;
        } catch (e) { /* 配额满或隐私模式，落到内存 */ }
      }
      memStore[key] = raw;
      return true;
    },
    del: function (key) {
      if (lsOk) {
        try { global.localStorage.removeItem(PREFIX + key); } catch (e) { /* ignore */ }
      }
      delete memStore[key];
    },
    /** 导出全部数据（备份用） */
    dump: function () {
      var out = {};
      if (lsOk) {
        try {
          for (var i = 0; i < global.localStorage.length; i++) {
            var k = global.localStorage.key(i);
            if (k && k.indexOf(PREFIX) === 0) {
              var v = global.localStorage.getItem(k);
              try { out[k.slice(PREFIX.length)] = JSON.parse(v); } catch (e) { out[k.slice(PREFIX.length)] = v; }
            }
          }
        } catch (e) { /* ignore */ }
      }
      Object.keys(memStore).forEach(function (k) {
        if (out[k] === undefined) {
          try { out[k] = JSON.parse(memStore[k]); } catch (e) { out[k] = memStore[k]; }
        }
      });
      return out;
    },
  };

  /* ==================== 提示音（Web Audio 合成） ==================== */

  function getAudioCtx() {
    if (audioCtx) return audioCtx;
    var Ctor = global.AudioContext || global.webkitAudioContext;
    if (!Ctor) return null;
    try { audioCtx = new Ctor(); } catch (e) { audioCtx = null; }
    return audioCtx;
  }

  /** 三声短促「叮」，与小程序版的 alert.wav 听感接近 */
  function beep() {
    var ctx = getAudioCtx();
    if (!ctx) return false;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    var freqs = [880, 1174, 1568];
    var t0 = ctx.currentTime;
    freqs.forEach(function (f, i) {
      var start = t0 + i * 0.2;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.28, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.18);
    });
    return true;
  }

  /* ==================== 震动 ==================== */
  function vibrate(pattern) {
    try {
      if (global.navigator && typeof global.navigator.vibrate === 'function') {
        return global.navigator.vibrate(pattern);
      }
    } catch (e) { /* 桌面浏览器普遍不支持，忽略 */ }
    return false;
  }

  /* ==================== 轻组件（可被 ui.js 覆盖） ==================== */
  var hooks = {
    toast: null,
    modal: null,
  };

  function defaultToast(opt) {
    var msg = (opt && (opt.title || opt.content)) || '';
    if (hooks.toast) return hooks.toast(opt);
    if (global.console) console.log('[toast] ' + msg);
  }

  function defaultModal(opt) {
    if (hooks.modal) return hooks.modal(opt);
    var msg = (opt && (opt.content || opt.title)) || '';
    var ok = global.confirm ? global.confirm(msg) : true;
    if (opt && typeof opt.success === 'function') {
      opt.success({ confirm: ok, cancel: !ok });
    }
  }

  /* ==================== 日历：导出 .ics ==================== */
  var calendarBuffer = [];

  function flushCalendar() {
    if (!calendarBuffer.length) return;
    var events = calendarBuffer.slice();
    calendarBuffer = [];
    if (global.SS && global.SS.ics) {
      global.SS.ics.download(events);
    }
  }

  /* ==================== wx 兼容对象 ==================== */
  var wx = {
    /* --- 存储 --- */
    getStorageSync: function (key) {
      var raw = store.get(key);
      if (raw === '' || raw === null || raw === undefined) return '';
      try { return JSON.parse(raw); } catch (e) { return raw; }
    },
    setStorageSync: function (key, value) {
      return store.set(key, value);
    },
    removeStorageSync: function (key) {
      store.del(key);
    },

    /* --- 反馈 --- */
    vibrateLong: function () { vibrate([0, 320, 120, 320]); },
    vibrateShort: function () { vibrate(35); },

    createInnerAudioContext: function () {
      return {
        src: '',
        volume: 1,
        loop: false,
        play: function () { beep(); },
        stop: function () {},
        pause: function () {},
        destroy: function () {},
        onError: function () {},
        onEnded: function () {},
      };
    },

    showToast: function (opt) { defaultToast(opt); },
    showModal: function (opt) { defaultModal(opt); },

    /* --- 网络（可选：后端同步用） --- */
    request: function (opt) {
      var o = opt || {};
      var init = {
        method: (o.method || 'GET').toUpperCase(),
        headers: o.header || {},
      };
      if (init.method !== 'GET' && o.data !== undefined) {
        init.headers['content-type'] = init.headers['content-type'] || 'application/json';
        init.body = typeof o.data === 'string' ? o.data : JSON.stringify(o.data);
      }
      var url = o.url;
      if (init.method === 'GET' && o.data) {
        var qs = Object.keys(o.data).map(function (k) {
          return encodeURIComponent(k) + '=' + encodeURIComponent(o.data[k]);
        }).join('&');
        if (qs) url += (url.indexOf('?') >= 0 ? '&' : '?') + qs;
      }
      fetch(url, init).then(function (res) {
        return res.json().then(function (data) {
          if (typeof o.success === 'function') {
            o.success({ statusCode: res.status, data: data });
          }
        });
      }).catch(function (err) {
        if (typeof o.fail === 'function') o.fail({ errMsg: String(err && err.message || err) });
      });
    },

    /* --- 日历：浏览器里退化为累积事件后下载 .ics --- */
    addPhoneCalendar: function (opt) {
      calendarBuffer.push(opt || {});
      if (typeof opt.success === 'function') opt.success({});
      // 一次性批量写入时，最后由 flush 统一生成文件
      clearTimeout(flushCalendar._t);
      flushCalendar._t = setTimeout(flushCalendar, 60);
    },
    getSetting: function (opt) {
      if (opt && typeof opt.success === 'function') opt.success({ authSetting: {} });
    },
    openSetting: function (opt) {
      if (opt && typeof opt.fail === 'function') opt.fail({ errMsg: 'browser not supported' });
    },

    /* --- 文件系统（网页版不走这里，用 FileReader） --- */
    getFileSystemManager: function () {
      return {
        readFileSync: function () {
          throw new Error('网页版请使用文件选择框（FileReader），不走文件系统 API');
        },
      };
    },
  };

  global.wx = wx;

  /** 暴露给 ui.js 覆盖提示组件 */
  global.WX_SHIM = {
    store: store,
    beep: beep,
    vibrate: vibrate,
    setToast: function (fn) { hooks.toast = fn; },
    setModal: function (fn) { hooks.modal = fn; },
    flushCalendar: flushCalendar,
  };
})(typeof window !== 'undefined' ? window : globalThis);

  { field: 'className', keys: ['上课班级', '教学班', '班级', '行政班'] },
];

/** 表头里的修饰词，剥离后往往就是真正的字段名（"上课地点" -> "地点"） */
const HEADER_NOISE = /^(?:本|该|此)?(?:上课|教学|授课|任课|课程|科目)?(?:信息|情况|内容|安排|明细|一览|表)?$/;

/** 两个字符串的字符重合度，用于容忍异体字与多余字 */
function charOverlap(a, b) {
  if (!a || !b) return 0;
  const set = {};
  for (let i = 0; i < b.length; i++) set[b[i]] = 1;
  let hit = 0;
  for (let i = 0; i < a.length; i++) if (set[a[i]]) hit++;
  return hit / Math.max(a.length, 1);
}

/**
 * 把表头单元格文本映射成字段名。
 * 策略（依次尝试，取匹配到的最长别名，避免 "教室类型" 被 "教室" 抢走）：
 *   1) 完全相等
 *   2) 包含别名
 *   3) 剥离修饰词后再匹配
 *   4) 字符重合度兜底（容忍错别字）
 */
function matchField(text) {
  const raw = norm(text).replace(/\s/g, '');
  if (!raw || raw.length > 16) return '';

  let t = raw.replace(/[（(].*?[)）]/g, '');
  if (!t) t = raw;

  // 1) 完全相等
  for (let i = 0; i < FIELD_ALIASES.length; i++) {
    const keys = FIELD_ALIASES[i].keys;
    for (let k = 0; k < keys.length; k++) {
      if (t === keys[k]) return FIELD_ALIASES[i].field;
    }
  }

  // 2) 包含别名 —— 取最长的别名，最长的优先
  let bestField = '';
  let bestLen = 0;
  for (let i = 0; i < FIELD_ALIASES.length; i++) {
    const keys = FIELD_ALIASES[i].keys;
    for (let k = 0; k < keys.length; k++) {
      const key = keys[k];
      if (key.length > bestLen && t.indexOf(key) >= 0) {
        bestLen = key.length;
        bestField = FIELD_ALIASES[i].field;
      }
    }
  }
  if (bestField) return bestField;

  // 3) 剥离修饰词
  const stripped = t.replace(/(?:上课|教学|授课|任课|课程|科目|日期|时间|地点|信息|情况|内容|安排|明细)/g, '');
  if (stripped && stripped !== t) {
    for (let i = 0; i < FIELD_ALIASES.length; i++) {
      const keys = FIELD_ALIASES[i].keys;
      for (let k = 0; k < keys.length; k++) {
        if (stripped === keys[k]) return FIELD_ALIASES[i].field;
      }
    }
  }

  // 4) 字符重合度兜底（只对 2-4 字的小词生效，避免误伤长句子）
  if (t.length >= 2 && t.length <= 4 && HEADER_NOISE.test(t) === false) {
    let field = '';
    let score = 0;
    for (let i = 0; i < FIELD_ALIASES.length; i++) {
      const keys = FIELD_ALIASES[i].keys;
      for (let k = 0; k < keys.length; k++) {
        const s = charOverlap(t, keys[k]);
        if (s >= 0.7 && s > score) {
          score = s;
          field = FIELD_ALIASES[i].field;
        }
      }
    }
    if (field) return field;
  }

  return '';
}

/** 判断文本是否"正好"是某个字段别名（用于识别重复表头） */
function isExactHeaderAlias(text) {
  const t = norm(text).replace(/\s/g, '').replace(/[（(].*?[)）]/g, '');
  if (!t || t.length > 16) return false;
  for (let i = 0; i < FIELD_ALIASES.length; i++) {
    const keys = FIELD_ALIASES[i].keys;
    for (let k = 0; k < keys.length; k++) {
      if (t === keys[k]) return true;
    }
  }
  return false;
}

/**
 * 判断这一行是不是"重复出现的表头行"。
 * 不能只看课程名单元格：像"课程设计""教师发展中心"这类正常内容也会包含字段关键词，
 * 那样会把真实课程整行丢掉。所以要求整行里多数单元格与别名**精确相等**。
 */
function looksLikeRepeatedHeader(row) {
  let exact = 0;
  let nonEmpty = 0;
  for (let c = 0; c < (row ? row.length : 0); c++) {
    const s = String(row[c] === undefined || row[c] === null ? '' : row[c]).trim();
    if (!s) continue;
    nonEmpty++;
    if (isExactHeaderAlias(s)) exact++;
  }
  return exact >= 3 && exact >= nonEmpty * 0.5;
}

/** 把一行单元格映射成 {field: col}，并记录命中数 */
function mapHeaderCells(row) {
  const columns = {};
  let hits = 0;
  const width = row ? row.length : 0;
  for (let c = 0; c < width; c++) {
    const f = matchField(row[c]);
    if (f && columns[f] === undefined) {
      columns[f] = c;
      hits++;
    }
  }
  return { columns: columns, hits: hits };
}

/**
 * 合并两行做"复合表头"。
 * 两行表头通常是「第一行大类 + 第二行细分」，所以 order 决定谁优先。
 */
function mergeHeaderRows(a, b, preferSecond) {
  const n = Math.max(a ? a.length : 0, b ? b.length : 0);
  const out = [];
  for (let c = 0; c < n; c++) {
    const va = a && a[c] !== undefined ? String(a[c]).trim() : '';
    const vb = b && b[c] !== undefined ? String(b[c]).trim() : '';
    if (!va) out.push(vb);
    else if (!vb) out.push(va);
    else out.push(preferSecond ? vb : va);
  }
  return out;
}

/** 给一个表头候选打分：有课程名 + 有时间类字段 + 命中数 */
function scoreHeaderCandidate(cand) {
  const cols = cand.columns;
  const hasName = cols.name !== undefined;
  const hasWhen = cols.day !== undefined || cols.period !== undefined || cols.time !== undefined;
  if (!hasName || !hasWhen) return 0;
  let score = cand.hits * 10;
  if (hasName) score += 40;
  if (cols.day !== undefined) score += 20;
  if (cols.period !== undefined || cols.time !== undefined) score += 20;
  if (cols.room !== undefined) score += 15;
  if (cols.weeks !== undefined) score += 15;
  if (cols.teacher !== undefined) score += 5;
  return score;
}

/**
 * 在表格里寻找最像表头的一行（找不到返回 null）
 * 支持单行表头与两行复合表头
 */
function findHeaderRow(rows, maxScan, minScore) {
  const limit = Math.min(rows.length, maxScan || 15);
  let best = null;

  for (let r = 0; r < limit; r++) {
    const variants = [];
    variants.push({ headRow: r, span: 1, cells: rows[r] });
    if (r + 1 < limit) {
      variants.push({ headRow: r, span: 2, cells: mergeHeaderRows(rows[r], rows[r + 1], true) });
      variants.push({ headRow: r, span: 2, cells: mergeHeaderRows(rows[r], rows[r + 1], false) });
    }

    for (let v = 0; v < variants.length; v++) {
      const cand = variants[v];
      const mapped = mapHeaderCells(cand.cells);
      const score = scoreHeaderCandidate(mapped);
      if (score <= 0) continue;
      // 越靠上的表头略微加权（前面通常是表格标题）
      const adjusted = score - cand.headRow * 2;
      if (adjusted < (minScore || 0)) continue;
      if (!best || adjusted > best.score) {
        best = {
          headerRow: cand.headRow,
          span: cand.span,
          startRow: cand.headRow + cand.span,
          columns: mapped.columns,
          hits: mapped.hits,
          score: adjusted,
        };
      }
    }
  }
  return best;
}

/**
 * 按给定的列映射提取数据行（列表式执行器）
 */
function extractRowsWithColumns(rows, startRow, columns, ctx) {
  const courses = [];
  const warnings = [];

  for (let r = startRow; r < rows.length; r++) {
    const row = rows[r];
    if (!row || isBlank(row.join(''))) continue;

    const name = getCell(row, columns.name);
    if (!name || isBlank(name)) continue;
    // 跳过重复出现的表头行（分页导出时常见）
    if (looksLikeRepeatedHeader(row)) continue;

    const item = {
      name: name.replace(/\s+/g, ' ').trim(),
      teacher: columns.teacher !== undefined ? getCell(row, columns.teacher).trim() : '',
      roomId: '',
      weeks: null,
      day: 0,
      start: 0,
      end: 0,
      warnings: [],
      _source: '第 ' + (r + 1) + ' 行',
      _fromHeader: true,
    };

    // 星期
    if (columns.day !== undefined) {
      item.day = parseDayStrict(getCell(row, columns.day)) ||
        parseDayFromLoose(getCell(row, columns.day));
    } else if (columns.time !== undefined) {
      const d = parseDayFromLoose(getCell(row, columns.time));
      if (d) item.day = d;
    }

    // 节次（优先节次列，其次时间列）
    let period = null;
    if (columns.period !== undefined) {
      period = parsePeriodLabel(getCell(row, columns.period), ctx.periods);
    }
    if (!period && columns.time !== undefined) {
      const cell = getCell(row, columns.time);
      period = parsePeriodLabel(cell, ctx.periods);
      if (!period) {
        // "周三 1-2节" 之类的组合列
        const seg = cell.match(/[^\s]*\d+\s*[-–—~～至到]\s*\d+\s*节?/);
        if (seg) period = parsePeriodLabel(seg[0], ctx.periods);
      }
    }
    if (period) {
      item.start = period.start;
      item.end = period.end;
    }

    // 周次
    if (columns.weeks !== undefined) {
      const w = parseWeeks(getCell(row, columns.weeks), true);
      if (w) item.weeks = { start: w.start, end: w.end, parity: w.parity, list: w.list };
    }
    if (!item.weeks) {
      const w2 = parseWeeks(getCell(row, columns.weeks === undefined ? -1 : columns.weeks), true);
      if (w2) item.weeks = { start: w2.start, end: w2.end, parity: w2.parity, list: w2.list };
    }

    // 教室
    if (columns.room !== undefined) {
      const cell = getCell(row, columns.room);
      const hit = extractRoomHit(cell, ctx.classrooms);
      if (hit) item.roomId = hit.roomId;
      else if (!isBlank(cell)) item.roomId = cell.replace(/\s+/g, '').toUpperCase();
    }

    if (!item.day) item.warnings.push('未识别到星期');
    if (!item.start) item.warnings.push('未识别到节次');
    if (!item.roomId) item.warnings.push('未识别到教室');
    if (!item.weeks) item.warnings.push('未识别到周次');
    item._confidence = confidenceOf(item);

    if (!item.day || !item.start) {
      warnings.push('第 ' + (r + 1) + ' 行「' + item.name + '」缺少星期或节次，已跳过');
      continue;
    }
    courses.push(item);
  }

  return { courses: courses, warnings: warnings };
}

/** 单条课程的识别置信度（0-1） */
function confidenceOf(item) {
  let hit = 0;
  let total = 5;
  if (item.day) hit++;
  if (item.start) hit++;
  if (item.roomId) hit++;
  if (item.weeks) hit++;
  if (item.teacher) hit++;
  return Math.round((hit / total) * 100) / 100;
}

/**
 * 尝试按"列表式"解析
 * @param {Array} rows
 * @param {Object} ctx
 * @param {Object} [forced] 由智能识别给出的既定方案 { headerRow, startRow, columns }
 * @returns {{courses:Array, headerRow:Number, columns:Object}|null}
 */
function extractFromList(rows, ctx, forced) {
  let plan = forced;
  if (!plan) {
    plan = findHeaderRow(rows);
    if (!plan) return null;
  }
  const startRow = plan.startRow !== undefined ? plan.startRow : (plan.headerRow + 1);
  const res = extractRowsWithColumns(rows, startRow, plan.columns, ctx);
  return {
    courses: res.courses,
    headerRow: plan.headerRow,
    columns: plan.columns,
    warnings: res.warnings,
  };
}

function getCell(row, index) {
  if (index === undefined || index < 0 || !row) return '';
  const v = row[index];
  return v === undefined || v === null ? '' : String(v);
}

/** 宽松解析星期：在任意位置找 "星期一" / "周三" 等 */
function parseDayFromLoose(text) {
  const t = norm(text);
  if (!t) return 0;
  let m = t.match(/(?:星期|周|礼拜)\s*([一二三四五六日天1-7])/);
  if (m) return DAY_CHAR[m[1]] || Number(m[1]) || 0;
  m = t.toLowerCase().match(/\b(mon|tue|wed|thu|fri|sat|sun)/);
  if (m) return DAY_EN[m[1]];
  return 0;
}

/* ==================== 网格式课表 ==================== */

/**
 * 找出所有"像星期表头"的行，越像越靠前。
 * 星期列越多、重复越少、位置越靠上，越可能是真正的表头行。
 */
function findGridHeaders(rows, maxScan) {
  const limit = Math.min(rows.length, maxScan || 20);
  const out = [];

  for (let r = 0; r < limit; r++) {
    const cols = [];
    let nonEmpty = 0;
    for (let c = 0; c < rows[r].length; c++) {
      const raw = rows[r][c];
      if (String(raw === undefined || raw === null ? '' : raw).trim()) nonEmpty++;
      const d = parseDayStrict(raw);
      if (d) cols.push({ col: c, day: d });
    }
    // 真正表头行里星期占比很高；普通数据行偶尔出现一个"星期一"不应被当成网格表头
    const dayRatio = nonEmpty ? cols.length / nonEmpty : 0;
    if (cols.length >= 3 && dayRatio >= 0.5) {
      const seen = {};
      let dup = 0;
      for (let i = 0; i < cols.length; i++) {
        if (seen[cols[i].day]) dup++;
        seen[cols[i].day] = 1;
      }
      out.push({
        headerRow: r,
        dayColumns: cols,
        dayRatio: dayRatio,
        score: cols.length * 10 + dayRatio * 20 - dup * 15 - r * 2,
      });
    }
  }
  return out.sort(function (a, b) { return b.score - a.score; });
}

/** 按给定的星期表头提取网格里的课程 */
function extractGridWith(rows, headerRow, dayColumns, ctx) {
  const firstDayCol = dayColumns[0].col;
  const dayColSet = {};
  dayColumns.forEach(function (d) { dayColSet[d.col] = d.day; });

  const courses = [];
  const warnings = [];
  const periodColVotes = {};

  for (let r = headerRow + 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || !row.length) continue;

    // 节次标签通常在星期列左侧，取最靠左能解析出节次的列
    let period = null;
    let periodCol = -1;
    for (let c = 0; c < Math.max(firstDayCol, 1); c++) {
      const hit = parsePeriodLabel(row[c], ctx.periods);
      if (hit) {
        period = hit;
        periodCol = c;
        break;
      }
    }
    if (!period) continue;
    periodColVotes[periodCol] = (periodColVotes[periodCol] || 0) + 1;

    for (let c = firstDayCol; c < row.length; c++) {
      const day = dayColSet[c];
      if (!day) continue;
      const cell = row[c];
      if (isBlank(cell)) continue;

      const parsed = parseCellContent(cell, ctx);
      for (let k = 0; k < parsed.length; k++) {
        const p = parsed[k];
        if (!p.name) continue;
        const item = {
          name: p.name,
          teacher: p.teacher,
          roomId: p.roomId,
          weeks: p.weeks,
          day: day,
          start: period.start,
          end: period.end,
          warnings: p.warnings.slice(),
          _source: '第' + (r + 1) + '行第' + (c + 1) + '列',
          _fromHeader: false,
        };
        item._confidence = confidenceOf(item);
        courses.push(item);
      }
      if (!parsed.length) {
        warnings.push('第 ' + (r + 1) + ' 行第 ' + (c + 1) + ' 列内容无法识别：' + String(cell).slice(0, 20));
      }
    }
  }

  if (!courses.length) return null;

  let bestCol = -1;
  let bestVotes = 0;
  Object.keys(periodColVotes).forEach(function (k) {
    if (periodColVotes[k] > bestVotes) {
      bestVotes = periodColVotes[k];
      bestCol = Number(k);
    }
  });

  return {
    courses: courses,
    headerRow: headerRow,
    dayColumns: dayColumns,
    periodCol: bestCol,
    warnings: warnings,
  };
}

/**
 * 尝试按"网格课表"解析
 * @param {Object} [forced] 由智能识别给出的既定方案 { headerRow, dayColumns }
 */
function extractFromGrid(rows, ctx, forced) {
  let plan = forced;
  if (!plan) {
    const headers = findGridHeaders(rows);
    if (!headers.length) return null;
    plan = headers[0];
  }
  return extractGridWith(rows, plan.headerRow, plan.dayColumns, ctx);
}

/* ==================== 相邻区间合并 ==================== */

function weeksKey(w) {
  if (!w) return 'none';
  if (Array.isArray(w.list)) return w.list.join(',');
  return w.start + '-' + w.end + '-' + (w.parity || 'all');
}

/**
 * 合并同一门课被拆到多行（未使用合并单元格）的情况
 * 例如 "第1节" 和 "第2节" 两行都是同一门课 -> 合并成 1-2 节
 */
function mergeAdjacent(courses) {
  const groups = {};
  const order = [];

  for (let i = 0; i < courses.length; i++) {
    const c = courses[i];
    const key = [c.name, c.day, c.roomId || '', c.teacher || '', weeksKey(c.weeks)].join('\u0001');
    if (!groups[key]) {
      groups[key] = [];
      order.push(key);
    }
    groups[key].push(c);
  }

  const out = [];
  for (let i = 0; i < order.length; i++) {
    const list = groups[order[i]].slice().sort(function (a, b) { return a.start - b.start; });
    let cur = null;
    for (let k = 0; k < list.length; k++) {
      const c = list[k];
      if (cur && c.start <= cur.end + 1) {
        cur.end = Math.max(cur.end, c.end);
        // 合并后取更高的置信度（信息更全的那条行）
        if ((c._confidence || 0) > (cur._confidence || 0)) cur._confidence = c._confidence;
        if (c._source && cur._source && cur._source.indexOf(c._source) < 0) {
          cur._source += '、' + c._source;
        }
      } else {
        if (cur) out.push(cur);
        cur = {
          name: c.name,
          teacher: c.teacher,
          roomId: c.roomId,
          weeks: c.weeks,
          day: c.day,
          start: c.start,
          end: c.end,
          warnings: (c.warnings || []).slice(),
          _source: c._source,
          _confidence: c._confidence,
          _fromHeader: c._fromHeader,
        };
      }
    }
    if (cur) out.push(cur);
  }
  return out;
}

/* ==================== 对外主入口 ==================== */

function defaultWeeks(ctx) {
  return { start: 1, end: (ctx && ctx.totalWeeks) || 16, parity: 'all' };
}

function finalize(courses, ctx) {
  const out = [];
  const unknownRooms = [];

  for (let i = 0; i < courses.length; i++) {
    const c = courses[i];
    if (!c.weeks) {
      c.weeks = defaultWeeks(ctx);
      c.warnings = (c.warnings || []).filter(function (w) { return w !== '未识别到周次'; });
      c.warnings.push('未识别到周次，已按 1-' + c.weeks.end + ' 周处理');
    }
    if (c.roomId && ctx.classrooms && ctx.classrooms.length) {
      const known = ctx.classrooms.some(function (r) { return r.id === c.roomId; });
      if (!known && unknownRooms.indexOf(c.roomId) < 0) unknownRooms.push(c.roomId);
    }
    if (c.name) out.push(c);
  }

  return {
    courses: out,
    unknownRooms: unknownRooms,
    stats: {
      total: out.length,
      withRoom: out.filter(function (c) { return !!c.roomId; }).length,
      withTeacher: out.filter(function (c) { return !!c.teacher; }).length,
    },
  };
}

/** 按智能识别给出的方案执行提取 */
function runPlan(rows, plan, ctx) {
  let raw = null;

  if (plan.layout === 'list') {
    raw = extractFromList(rows, ctx, {
      headerRow: plan.headerRow,
      startRow: plan.startRow !== undefined ? plan.startRow : plan.headerRow + 1,
      columns: plan.columns,
    });
  } else if (plan.layout === 'grid') {
    raw = extractFromGrid(rows, ctx, {
      headerRow: plan.headerRow,
      dayColumns: plan.dayColumns,
    });
  }
  if (!raw || !raw.courses.length) return null;

  const merged = mergeAdjacent(raw.courses);
  const fin = finalize(merged, ctx);
  return Object.assign({
    layout: plan.layout,
    headerRow: plan.headerRow,
    columns: plan.columns,
    dayColumns: plan.dayColumns,
    plan: plan,
  }, fin, { warnings: raw.warnings || [] });
}

/**
 * 从二维表格提取课程
 * @param {Array<Array<String>>} rows
 * @param {Object} ctx  { classrooms, periods, totalWeeks }
 * @param {Object} [plan] 智能识别给出的方案（不传则使用内置的常规识别）
 */
function extractFromTable(rows, ctx, plan) {
  const context = ctx || {};
  // 注意：这里不能过滤掉空行，否则行号会和智能识别给出的方案错位
  //（方案里的 headerRow / startRow 都是按原始行号算的）
  const all = (rows || []).map(function (r) {
    return (r || []).map(function (v) { return v === undefined || v === null ? '' : String(v); });
  });

  const hasContent = all.some(function (r) {
    return r.some(function (v) { return !isBlank(v); });
  });
  if (!hasContent) {
    return { courses: [], layout: 'empty', warnings: ['表格是空的'], unknownRooms: [], stats: { total: 0 } };
  }

  // 智能识别给出的方案优先
  if (plan && plan.layout) {
    const byPlan = runPlan(all, plan, context);
    if (byPlan && byPlan.courses.length) return byPlan;
  }

  // 常规识别：先列表式（有明确表头），再网格式
  const list = extractFromList(all, context);
  if (list && list.courses.length) {

    return Object.assign({ layout: 'list', headerRow: list.headerRow, columns: list.columns },

      try { history.replaceState(null, '', '#/' + tab); } catch (e) { location.hash = '#/' + tab; }
    }
    render();
  }

  function syncTabbar() {
    $$('#tabbar .tab').forEach(function (btn) {
      var active = btn.getAttribute('data-tab') === view.tab;
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    // 「导入」不是独立 tab，挂在课表页里；进入导入时点亮课表
    if (view.tab === 'import') {
      var tb = $('#tabbar .tab[data-tab="timetable"]');
      if (tb) tb.setAttribute('aria-selected', 'true');
    }
  }

  /* ============================================================
     四、今日视图
     ============================================================ */

  var tickTimer = null;
  var lastMinute = -1;

  function renderToday() {
    var now = new Date();
    var settings = data.settings;
    var timeline = S.buildTimeline(data.courses, data.classrooms, data.periods, now, settings);
    var next = S.getNextClass(data.courses, data.classrooms, data.periods, now, settings);
    var current = S.getCurrentClass(data.courses, data.classrooms, data.periods, now, settings);

    var html = '';
    html += heroHtml(now, current, next);
    html += studyHtml(now);
    html += timelineHtml(timeline);
    html += freeSlotsHtml(timeline);

    if (!data.courses.length) {
      html += '<div class="card"><div class="empty">还没有课表<br><button class="btn btn-primary mt12" data-action="go-import">导入课表</button></div></div>';
    }

    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    $('#view').appendChild(wrap);

    startTick();
    maybeDailyBrief(timeline);
    checkRemind();
  }

  function heroHtml(now, current, next) {
    var week = T.getWeekIndex(now, data.settings.termStartDate);
    var weekText = '第 ' + Math.max(1, week) + ' 周';
    var dateLabel = T.humanDate(now);

    var mode = 'idle';
    var label = '';
    var lesson = null;
    var clock = '--:--:--';

    if (current) {
      mode = 'during';
      label = '正在上课 · 距离下课';
      lesson = {
        name: current.course.name,
        room: current.room,
        periodText: S.formatPeriods(current.course.start, current.course.end),
        startTime: current.startTime,
        endTime: current.endTime,
        teacher: current.course.teacher,
      };
      clock = hms(current.endAt.getTime() - now.getTime());
    } else if (next) {
      mode = next.isToday ? 'before' : 'idle';
      label = next.isToday ? '距离上课还有' : '下一节课在 ' + next.dateLabel;
      lesson = {
        name: next.course.name,
        room: next.room,
        periodText: next.periodText,
        startTime: next.startTime,
        endTime: next.endTime,
        teacher: next.course.teacher,
      };
      clock = hms(next.startAt.getTime() - now.getTime());
    }

    var html = '<section class="hero ' + mode + '" id="hero">';
    html += '<div class="hero-top"><span>' + esc(dateLabel) + '</span><span>' + esc(weekText) + '</span></div>';
    html += '<div class="hero-label" id="hero-label">' + esc(label || '近期没有课程安排') + '</div>';
    html += '<div class="hero-count" id="hero-clock">' + clock + '</div>';

    if (lesson) {
      html += '<div class="hero-course">' +
        '<div class="hero-name">' + esc(lesson.name) + '</div>' +
        '<div class="hero-meta">' + esc(lesson.periodText) + ' · ' + esc(lesson.startTime) + '-' + esc(lesson.endTime) + '</div>' +
        '<div class="hero-room">📍 ' + esc(lesson.room) + (lesson.teacher ? ' · ' + esc(lesson.teacher) : '') + '</div>' +
        '</div>';
      html += '<div class="hero-actions">' +
        '<button class="hero-btn" data-action="copy-room">复制教室</button>' +
        '<button class="hero-btn" data-action="export-ics">导出日历</button>' +
        '<button class="hero-btn" data-action="go-classroom">找空教室</button>' +
        '</div>';
    } else {
      html += '<div class="hero-actions">' +
        '<button class="hero-btn" data-action="go-import">导入课表</button>' +
        '<button class="hero-btn" data-action="go-classroom">找空教室</button>' +
        '</div>';
    }
    html += '</section>';
    return html;
  }

  function studyHtml(now) {
    var stu;
    try {
      stu = C.queryFreeRoomsNow({
        courses: data.courses, occupancy: data.occupancy, classrooms: data.classrooms,

    }

    var rooms = stu.free.slice(0, 3);

      '<span class="sub">' + esc(stu.periodText) + ' 空</span></div>';
    rooms.forEach(function (r) {
      html += '<div class="line"><div class="grow"><div class="strong">' + esc(r.name) + '</div>' +
        '<div class="tiny muted mt8">' + esc(roomMeta(r)) + '</div></div>' +
        '<span class="tag tag-green">' + esc(r.freeSpanText) + '</span></div>';

    html += '<button class="btn btn-ghost mt12" data-action="go-classroom">查看全部空教室</button></section>';
    return html;
  }

  function timelineHtml(timeline) {
    var html = '<section class="card"><div class="card-title"><span>今日课程</span>' +
      '<span class="sub">共 ' + timeline.courses.length + ' 节</span></div>';
    if (!timeline.courses.length) {
      html += '<div class="empty">今天没有课，去自习吧</div>';
    }
    timeline.courses.forEach(function (c, i) {
      html += '<div class="line ' + (c.status === 'done' ? 'done' : '') + '">' +
        '<div class="tl-time">' + esc(c.startTime) + '<div class="end">' + esc(c.endTime) + '</div></div>' +
        '<div class="line-dot" style="background:' + esc(c.color) + '"></div>' +
        '<div class="grow"><div class="strong ellipsis">' + esc(c.name) + '</div>' +
        '<div class="tiny muted">' + esc(c.periodText) + ' · ' + esc(c.room) + '</div>' +
        (c.note ? '<div class="tiny muted">📌 ' + esc(c.note) + '</div>' : '') + '</div>' +
        '<span class="tl-status ' + esc(c.status) + '">' + esc(c.statusText) + '</span>' +
        '</div>';

  }

  function freeSlotsHtml(timeline) {
    if (!timeline.freeSlots.length) return '';
    var html = '<section class="card"><div class="card-title"><span>今日空堂</span><span class="sub">没课的时间段</span></div>';
    timeline.freeSlots.forEach(function (s) {
      html += '<div class="line"><div class="grow"><div class="strong">' + esc(s.periodText) + '</div>' +
        '<div class="tiny muted">' + esc(s.startTime) + ' - ' + esc(s.endTime) + '</div></div>' +
        '<span class="tag tag-orange">空</span></div>';
    });
    html += '<button class="btn btn-ghost mt12" data-action="go-classroom">这些时段哪间教室空着</button></section>';
    return html;
  }

  /* ---------------- 倒计时与提醒 ---------------- */

  function startTick() {
    stopTick();
    tick();
    tickTimer = setInterval(tick, 1000);
  }
  function stopTick() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  function tick() {
    if (view.tab !== 'today') return;
    var now = new Date();
    var clockEl = $('#hero-clock');
    if (!clockEl) return;

    var current = S.getCurrentClass(data.courses, data.classrooms, data.periods, now, data.settings);
    var next = S.getNextClass(data.courses, data.classrooms, data.periods, now, data.settings);
    var labelEl = $('#hero-label');
    var heroEl = $('#hero');

    if (current) {
      clockEl.textContent = hms(current.endAt.getTime() - now.getTime());
      if (labelEl) labelEl.textContent = '正在上课 · 距离下课';
      if (heroEl) heroEl.className = 'hero during';
    } else if (next) {
      clockEl.textContent = hms(next.startAt.getTime() - now.getTime());
      if (labelEl) labelEl.textContent = next.isToday ? '距离上课还有' : '下一节课在 ' + next.dateLabel;
      if (heroEl) heroEl.className = 'hero ' + (next.isToday ? 'before' : 'idle');
    } else {
      clockEl.textContent = '--:--:--';
      if (labelEl) labelEl.textContent = '近期没有课程安排';
    }

    // 每分钟检查一次是否需要整页刷新（跨节次、跨天）
    var minute = now.getHours() * 60 + now.getMinutes();
    if (lastMinute !== -1 && minute !== lastMinute) {
      lastMinute = minute;
      render();
      return;
    }
    lastMinute = minute;

    // 每 15 秒检查提醒
    if (now.getSeconds() % 15 === 0) checkRemind();
  }

  var remindedThisSession = {};

  function checkRemind() {
    var r = N.checkAndRemind(data.courses, data.classrooms, data.periods, data.settings, { now: new Date() });
    if (!r.alert) return;
    showReminder(r.alert);
  }

  function showReminder(alert) {
    // 页面内红色横幅
    var banner = document.createElement('div');
    banner.className = 'alert-banner';
    banner.setAttribute('data-reminder', '1');
    banner.innerHTML = '<div class="t">' + esc(alert.title) + '</div>' +
      '<div class="small mt8" style="white-space:pre-line">' + esc(alert.content) + '</div>' +
      '<button class="btn btn-sm mt12" style="background:rgba(255,255,255,.22);color:#fff" data-action="dismiss-alert">知道了</button>';
    var viewEl = $('#view');
    if (viewEl.firstChild) viewEl.insertBefore(banner, viewEl.firstChild);
    else viewEl.appendChild(banner);

    // 浏览器通知
    if (data.settings.notifyEnabled && window.Notification && Notification.permission === 'granted') {
      try {
        new Notification(alert.title, { body: alert.content, tag: 'ss-reminder', renotify: true });
      } catch (e) { /* ignore */ }
    }
    // 震动 + 声音已由 notify.fireAlert 通过 shim 触发
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  var briefShownFor = '';

  function maybeDailyBrief(timeline) {
    if (!timeline.courses.length) return;
    var key = 'brief:' + todayStr();
    if (briefShownFor === key) return;
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, '1');
    briefShownFor = key;
  }

  /* ============================================================
     五、课表视图
     ============================================================ */

  function renderTimetable() {
    var week = view.week || currentWeek();
    view.week = week;
    var dayCount = view.showWeekend ? 7 : 5;
    var dates = T.weekDates(week, data.settings.termStartDate);
    var periods = data.periods;
    var today = new Date();
    var todayIndex = T.getDayOfWeek(today);
    var isCurrentWeek = week === T.getWeekIndex(today, data.settings.termStartDate);

    var html = '<section class="card">';
    html += '<div class="week-bar">' +
      '<button class="week-nav" data-action="week-prev">‹ 上周</button>' +
      '<div class="week-title">第 ' + week + ' 周 · ' +
      (dates[0].getMonth() + 1) + '/' + dates[0].getDate() + ' - ' +
      (dates[dayCount - 1].getMonth() + 1) + '/' + dates[dayCount - 1].getDate() + '</div>' +
      '<button class="week-nav" data-action="week-next">下周 ›</button></div>';

    html += '<div class="chips" style="margin-bottom:12px">' +
      '<button class="chip ' + (view.showWeekend ? '' : 'active') + '" data-action="toggle-weekend">只看周一~周五</button>' +
      '<button class="chip" data-action="week-now">回到本周</button>' +
      '<button class="chip" data-action="go-import">导入 / 编辑</button>' +
      '</div>';

    html += '<div class="tt-grid" style="grid-template-columns:40px repeat(' + dayCount + ',minmax(0,1fr))">';

    // 表头
    html += '<div class="tt-head"></div>';
    for (var d = 1; d <= dayCount; d++) {
      var dt = dates[d - 1];
      var isToday = isCurrentWeek && d === todayIndex;
      html += '<div class="tt-head' + (isToday ? ' today' : '') + '">' +
        '<b>' + T.WEEK_SHORT[d] + '</b><span>' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</span></div>';
    }

    // 节次列 + 空格
    for (var p = 0; p < periods.length; p++) {
      var period = periods[p];
      html += '<div class="tt-period" style="grid-row:' + (p + 2) + ';grid-column:1">' +
        '<b>' + period.period + '</b><span>' + esc(period.start) + '</span></div>';
      for (var dd = 1; dd <= dayCount; dd++) {
        html += '<button class="tt-cell" style="grid-row:' + (p + 2) + ';grid-column:' + (dd + 1) + ';z-index:1"' +
          ' data-action="cell" data-day="' + dd + '" data-period="' + period.period + '"' +
          ' aria-label="第' + period.period + '节 周' + T.WEEK_SHORT[dd] + '"></button>';
      }
    }

    // 课程块
    data.courses.forEach(function (course) {
      if (course.day > dayCount) return;
      if (!S.isWeekActive(course, week, data.settings.totalWeeks)) return;
      var startIdx = 0;
      for (var i = 0; i < periods.length; i++) if (periods[i].period === course.start) startIdx = i;
      var span = 0;
      for (var k = 0; k < periods.length; k++) {
        if (periods[k].period >= course.start && periods[k].period <= course.end) span++;
      }
      span = Math.max(1, span);
      var t = S.periodRange(periods, course.start, course.end);
      html += '<button class="tt-block" style="grid-row:' + (startIdx + 2) + ' / span ' + span +
        ';grid-column:' + (course.day + 1) + ';background:' + esc(course.color) + '"' +
        ' data-action="course" data-id="' + esc(course.id) + '">' +
        '<div class="nm">' + esc(course.name) + '</div>' +
        '<div class="rm">' + esc(course.roomId || '') + '</div></button>';
    });

    html += '</div>';
    html += '<div class="tiny muted mt12" style="text-align:center">点空白格 → 看该时段空教室；点课程块 → 看详情</div>';
    html += '</section>';

    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    $('#view').appendChild(wrap);
  }

  /* ============================================================
     六、空教室视图
     ============================================================ */

  function renderClassroom() {
    var rv = view.room;
    var periods = data.periods;
    if (!rv.date) rv.date = todayStr();

    if (rv.startIndex >= periods.length) rv.startIndex = 0;
    if (rv.endIndex >= periods.length) rv.endIndex = Math.min(1, periods.length - 1);

    var startPeriod = periods[rv.startIndex].period;
    var endPeriod = periods[rv.endIndex].period;

    var res = C.queryFreeRooms({
      date: rv.date, startPeriod: startPeriod, endPeriod: endPeriod,
      courses: data.courses, occupancy: data.occupancy, classrooms: data.classrooms,
      periods: periods, settings: data.settings,
      building: rv.building, minCapacity: rv.capacity,
      onlyStudy: rv.onlyStudy, facilities: rv.facilities, sort: rv.sort,
    });

    var d = T.parseDate(rv.date);
    var week = T.getWeekIndex(d, data.settings.termStartDate);
    var dayName = T.WEEK_NAMES[T.getDayOfWeek(d)];

    var html = '';

    // 日期与节次
    html += '<section class="card">';
    html += '<div class="chips">';
    [{ label: '今天', off: 0 }, { label: '明天', off: 1 }, { label: '后天', off: 2 }].forEach(function (x) {
      var ds = T.formatDate(T.addDays(new Date(), x.off));
      html += '<button class="chip ' + (ds === rv.date ? 'active' : '') + '" data-action="room-date" data-date="' + ds + '">' + x.label + '</button>';
    });
    html += '<button class="chip" data-action="room-date-pick">📅 ' + (d.getMonth() + 1) + '月' + d.getDate() + '日</button>';
    html += '</div>';

    html += '<div class="row gap8 mt12">';
    html += '<select class="select grow" data-action="room-start">';
    periods.forEach(function (p, i) {
      html += '<option value="' + i + '"' + (i === rv.startIndex ? ' selected' : '') + '>起：第 ' + p.period + ' 节</option>';
    });
    html += '</select>';
    html += '<select class="select grow" data-action="room-end">';
    periods.forEach(function (p, i) {
      html += '<option value="' + i + '"' + (i === rv.endIndex ? ' selected' : '') + '>止：第 ' + p.period + ' 节</option>';
    });
    html += '</select>';
    html += '</div>';

    html += '<div class="chips mt12">';
    html += '<button class="chip" data-action="room-now">现在</button>';
    html += '<button class="chip" data-action="room-quick" data-key="morning">上午</button>';
    html += '<button class="chip" data-action="room-quick" data-key="afternoon">下午</button>';
    html += '<button class="chip" data-action="room-quick" data-key="evening">晚上</button>';
    html += '<button class="chip" data-action="room-quick" data-key="span2">连空 2 节</button>';
    html += '<button class="chip" data-action="room-quick" data-key="span3">连空 3 节</button>';
    html += '</div>';
    html += '</section>';

    // 筛选
    html += '<section class="card">';
    html += '<div class="tiny muted">教学楼</div><div class="chips mt8">';
    html += '<button class="chip ' + (rv.building === '' ? 'active' : '') + '" data-action="room-building" data-building="">全部</button>';
    (res.buildings || []).forEach(function (b) {
      html += '<button class="chip ' + (rv.building === b ? 'active' : '') + '" data-action="room-building" data-building="' + esc(b) + '">' + esc(b) + '</button>';
    });
    html += '</div>';

    html += '<div class="tiny muted mt12">座位数</div><div class="chips mt8">';
    [{ l: '不限', v: 0 }, { l: '≥30', v: 30 }, { l: '≥60', v: 60 }, { l: '≥100', v: 100 }].forEach(function (x) {
      html += '<button class="chip ' + (rv.capacity === x.v ? 'active' : '') + '" data-action="room-capacity" data-v="' + x.v + '">' + x.l + '</button>';
    });
    html += '</div>';

    html += '<div class="tiny muted mt12">设施</div><div class="chips mt8">';
    Object.keys(FACILITY_LABEL).slice(0, 3).forEach(function (f) {
      var on = rv.facilities.indexOf(f) >= 0;
      html += '<button class="chip ' + (on ? 'active' : '') + '" data-action="room-facility" data-f="' + f + '">' + FACILITY_LABEL[f] + '</button>';
    });
    html += '<button class="chip ' + (rv.onlyStudy ? 'active' : '') + '" data-action="room-onlystudy">仅可自习</button>';
    html += '</div></section>';

    // 统计
    html += '<div class="stat-bar">' +
      '<div class="stat-line">第 ' + Math.max(1, week) + ' 周 ' + dayName + ' · 第 ' + startPeriod + '-' + endPeriod + ' 节 ' +
      esc(res.timeRange.start) + '-' + esc(res.timeRange.end) + '</div>' +
      '<div class="stat-main"><span class="stat-num">' + res.free.length + '</span>' +
      '<span>间空闲</span><span class="stat-sub">可自习 ' + data.classrooms.filter(function (x) { return x.openForStudy !== false; }).length +
      ' 间 · 占用 ' + res.occupied.length + ' 间</span></div></div>';

    if (!data.occupancy.length) {
      html += '<div class="warn">⚠️ 未导入全校教室占用表，结果只按你自己的课表推算，可能偏多。' +
        '可在「设置 → 数据管理」导入。</div>';
    }
    if (res.unknownRooms && res.unknownRooms.length) {
      html += '<div class="warn">⚠️ 课表里有教室不在字典中：' + esc(res.unknownRooms.join('、')) +
        '。它们不会出现在结果里，可在「设置」里一键补充。</div>';
    }

    if (!res.free.length) {
      html += '<div class="card"><div class="empty">该条件下没有空闲教室，试试放宽节次或筛选</div></div>';
    }

    res.free.forEach(function (r, i) {
      html += '<button class="room-card" data-action="room-detail" data-id="' + esc(r.id) + '">' +
        '<div class="between"><div class="room-name">' + esc(r.name) + '</div>' +
        '<span class="tag tag-green">' + esc(r.freeSpanText) + '</span></div>' +
        (r.runSpanText ? '<div class="tiny muted mt8">🕒 ' + esc(r.runSpanText) + '</div>' : '') +
        '<div class="tiny muted mt8">' + esc(roomMeta(r)) + '</div>' +
        (r.facilityLabels && r.facilityLabels.length
          ? '<div class="mt8">' + r.facilityLabels.map(function (f) { return '<span class="tag tag-gray" style="margin-right:6px">' + esc(f) + '</span>'; }).join('') + '</div>'
          : '') +
        '<div class="tiny muted mt8">今日空堂：' + r.freeRuns.map(function (x) { return esc(x.periodText); }).join('、') + '</div>' +
        '</button>';
    });

    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    $('#view').appendChild(wrap);
  }

  function bindFilePicker() {
    var zone = $('#dropzone');
    var input = $('#file-input');
    if (!zone || !input) return;

    zone.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () {
      if (input.files && input.files[0]) handleFile(input.files[0]);
    });

    ['dragenter', 'dragover'].forEach(function (ev) {
      zone.addEventListener(ev, function (e) {
        e.preventDefault();
        zone.classList.add('over');
      });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      zone.addEventListener(ev, function (e) {
        e.preventDefault();
        zone.classList.remove('over');
      });
    });
    zone.addEventListener('drop', function (e) {
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
  }

  function handleFile(file) {
    var MAX = FI.MAX_BYTES;
    if (file.size > MAX) {
      UI.alert({ title: '文件太大', content: '请只保留课表内容后重试（上限 ' + Math.round(MAX / 1024 / 1024) + 'MB）' });
      return;
    }
    var resultEl = $('#file-result');
    if (resultEl) resultEl.innerHTML = '<div class="tiny muted mt12">正在解析 ' + esc(file.name) + ' …</div>';

    var reader = new FileReader();
    reader.onload = function () {
      var bytes = new Uint8Array(reader.result);
      var res;
      try {
        res = FI.parseBytes(bytes, file.name, {
          classrooms: data.classrooms,
          periods: data.periods,
          totalWeeks: data.settings.totalWeeks,
        });
      } catch (e) {
        res = { ok: false, error: '解析异常：' + (e.message || e) };
      }
      if (resultEl) resultEl.innerHTML = '';
      showImportResult(res, file.name);
    };
    reader.onerror = function () {
      if (resultEl) resultEl.innerHTML = '';
      UI.alert({ title: '读取失败', content: '无法读取这个文件，请换一个试试。' });
    };
    reader.readAsArrayBuffer(file);
  }

  function showImportResult(res, fileName) {
    if (!res || !res.ok) {
      var msg = (res && res.error) || '解析失败';
      UI.sheet({
        title: '没有识别出课表',
        sub: fileName || '',
        bodyHtml: '<div class="tiny muted" style="white-space:pre-line">' + esc(msg) + '</div>',
        actions: [{ label: '知道了', style: 'primary' }],
      });
      return;
    }
    view.importPreview = res;
    renderImportPreview(res);
  }

  function renderImportPreview(res) {
    var box = $('#import-preview');
    if (!box) return;

    var layoutText = { list: '列表式', grid: '课表网格', text: '文本行' }[res.layout] || res.layout;
    var parts = ['识别出 ' + res.courses.length + ' 门课程（布局：' + layoutText + '）'];
    var rc = res.recognize;
    if (rc && rc.method) {
      parts.push('🔍 ' + rc.method);
      if (rc.source === 'content' && rc.inferred && rc.inferred.columns) {
        var names = { name: '课程名', day: '星期', period: '节次', time: '时间', room: '教室', weeks: '周次', teacher: '教师' };
        var cols = rc.inferred.columns;
        parts.push('按内容推断：' + Object.keys(cols).map(function (f) {
          return (names[f] || f) + '=第' + (cols[f] + 1) + '列';
        }).join('、'));
      }
      if (rc.confidence) parts.push('字段完整度：' + Math.round(rc.confidence * 100) + '%');
    }
    (res.warnings || []).forEach(function (w) { parts.push('· ' + w); });

    var html = '<section class="card">';
    html += '<div class="card-title"><span>解析预览</span><span class="sub">' + res.courses.length + ' 条</span></div>';
    html += '<div class="warn" style="white-space:pre-line">' + esc(parts.join('\n')) + '</div>';

    if (res.unknownRooms && res.unknownRooms.length) {
      html += '<div class="warn">⚠️ 有 ' + res.unknownRooms.length + ' 间教室不在教室字典里：' +
        esc(res.unknownRooms.slice(0, 8).join('、')) + (res.unknownRooms.length > 8 ? '…' : '') +
        '<br>不补进字典的话，它们不会出现在「空教室」查询结果里。' +
        '<br><button class="btn btn-sm btn-ghost mt8" data-action="add-unknown-rooms">一键加入教室字典</button></div>';
    }

    res.courses.slice(0, 40).forEach(function (c) {
      var conf = Math.round((c._confidence === undefined ? 1 : c._confidence) * 100);
      html += '<div class="preview-item">' +
        '<div class="between"><span class="strong">' + esc(c.name) + '</span>' +
        (conf < 100 ? '<span class="tag tag-orange">需确认 ' + conf + '%</span>' : '<span class="tag tag-green">完整</span>') +
        '</div>' +
        '<div class="tiny muted mt8">' + esc(T.WEEK_NAMES[c.day]) + ' ' + esc(S.formatPeriods(c.start, c.end)) +
        ' · ' + esc(c.roomId || '未识别') + (c.teacher ? ' · ' + esc(c.teacher) : '') +
        ' · ' + esc(S.formatWeeks(c.weeks)) + '</div>' +
        ((c.warnings && c.warnings.length) ? '<div class="tiny" style="color:var(--orange)">⚠ ' + esc(c.warnings.join('；')) + '</div>' : '') +
        '</div>';
    });
    if (res.courses.length > 40) {
      html += '<div class="tiny muted" style="padding:8px 0">预览只显示前 40 条，导入时会全部写入</div>';
    }

    html += '<div class="row gap8 mt12">' +
      '<button class="btn btn-plain grow" data-action="import-cancel">取消</button>' +
      '<button class="btn btn-ghost grow" data-action="import-append">追加导入</button>' +
      '<button class="btn btn-primary grow" data-action="import-replace">替换课表</button>' +
      '</div></section>';

    box.innerHTML = html;
  }

  function doImport(mode) {
    var res = view.importPreview;
    if (!res || !res.courses.length) return;
    var stamped = res.courses.map(function (c, i) {
      return Object.assign({}, c, { id: 'imp_' + Date.now() + '_' + i });
    });
    var list = mode === 'append' ? data.courses.concat(stamped) : stamped;
    saveCourses(list);
    view.importPreview = null;
    var conflicts = S.detectConflicts(list);
    UI.toast('已导入 ' + stamped.length + ' 门课程');
    if (conflicts.length) {
      setTimeout(function () {
        UI.alert({ title: '检测到时间冲突', content: conflicts.slice(0, 3).map(function (c) { return c.message; }).join('\n') });
      }, 300);
    }
    go('today');
  }

  function collectUnknownRooms() {
    var known = {};
    data.classrooms.forEach(function (r) { known[r.id] = 1; });
    var out = [];
    data.courses.forEach(function (c) {
      if (c.roomId && !known[c.roomId] && out.indexOf(c.roomId) < 0) out.push(c.roomId);
    });
    return out;
  }

  /**
   * 用来分享给别人访问的地址。
   * 本地开发服务器会往页面注入 window.__SS_HOST__（本机局域网 IP），
   * 这样即使自己用 localhost 打开，二维码里也是手机能访问的地址。
   */
  function shareBaseUrl() {
    var host = window.__SS_HOST__;
    if (host && host.lan) {
      return 'http://' + host.lan + ':' + host.port + '/';
    }
    var base = location.origin + location.pathname.replace(/index\.html$/, '');
    return base.replace(/\/$/, '') + '/';
  }

  function isLocalhostUrl(url) {
    return /\/\/(localhost|127\.0\.0\.1|\[::1\])/.test(url);
  }
